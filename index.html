<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蓝牙 MCP 中继控制台</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #eee; margin: 0; padding: 20px; }
        h1 { font-size: 20px; text-align: center; color: #00e5ff; }
        .card { background: #1e1e1e; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .status-bar { display: flex; justify-content: space-between; font-size: 14px; }
        .status-ok { color: #4caf50; }
        .status-err { color: #f44336; }
        .control-group { margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #333; }
        .control-group:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .control-label { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 14px; }
        input[type="range"] { width: 100%; accent-color: #00e5ff; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: opacity 0.2s; }
        button:active { opacity: 0.7; }
        .btn-start { background: #00e5ff; color: #000; width: 100%; margin-bottom: 15px; padding: 15px; font-size: 18px; }
        .btn-test { background: #ff9800; color: #fff; }
        .btn-stop { background: #f44336; color: #fff; }
        .btn-action { background: #2196f3; color: #fff; }
        #log-area { background: #000; color: #0f0; font-family: monospace; font-size: 12px; padding: 10px; border-radius: 8px; height: 150px; overflow-y: auto; word-break: break-all; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <h1>🤖 蓝牙 MCP 中继控制台</h1>

    <button id="btn-start" class="btn-start">启动系统 (允许音频 & 连接蓝牙)</button>

    <div class="card status-bar">
        <div>MCP: <span id="mcp-status" class="status-err">未连接</span></div>
        <div>蓝牙: <span id="ble-status" class="status-err">未连接</span></div>
    </div>

    <div id="control-panel" class="card" style="display: none;">
        <!-- 震动 -->
        <div class="control-group">
            <div class="control-label"><span>震动强度</span><span id="val-vibrate">0</span></div>
            <input type="range" id="slider-vibrate" min="0" max="100" value="0" oninput="document.getElementById('val-vibrate').innerText=this.value">
            <div class="btn-group">
                <button class="btn-action" onclick="sendCommand('震动', document.getElementById('slider-vibrate').value)">发送震动指令</button>
            </div>
        </div>

        <!-- 伸缩 -->
        <div class="control-group">
            <div class="control-label"><span>伸缩程度</span><span id="val-telescope">0</span></div>
            <input type="range" id="slider-telescope" min="0" max="100" value="0" oninput="document.getElementById('val-telescope').innerText=this.value">
            <div class="btn-group">
                <button class="btn-action" onclick="sendCommand('伸缩', document.getElementById('slider-telescope').value)">发送伸缩指令</button>
            </div>
        </div>

        <!-- 转动 -->
        <div class="control-group">
            <div class="control-label"><span>转动速度</span><span id="val-rotate">0</span></div>
            <input type="range" id="slider-rotate" min="0" max="100" value="0" oninput="document.getElementById('val-rotate').innerText=this.value">
            <div class="btn-group">
                <button class="btn-action" onclick="sendCommand('转动', document.getElementById('slider-rotate').value)">发送转动指令</button>
            </div>
        </div>

        <!-- 加热 -->
        <div class="control-group">
            <div class="btn-group">
                <button class="btn-action" style="background:#e91e63;" onclick="sendCommand('加热', 'ON')">开启加热</button>
                <button class="btn-action" style="background:#607d8b;" onclick="sendCommand('加热', 'OFF')">关闭加热</button>
            </div>
        </div>

        <!-- 测试与停止 -->
        <div class="btn-group" style="margin-top: 20px;">
            <button class="btn-test" onclick="testConnection()">测试所有功能</button>
            <button class="btn-stop" onclick="stopAll()">🛑 停止所有功能</button>
        </div>
    </div>

    <div class="card">
        <div style="font-size: 14px; margin-bottom: 5px;">📋 运行日志：</div>
        <div id="log-area">等待启动...</div>
    </div>

    <!-- 隐藏的无声音频保活 -->
    <audio id="keep-alive-audio" loop muted>
        <source src="https://img.baibai.cv/f/dZymTQ/30min-osbvow%202.mp4" type="audio/mpeg">
    </audio>

    <script>
        // ================= 配置区 (请在此处修改) =================
        const MCP_SERVER_URL = '/toy-next'; // ⚠️ 请替换为你的公网 MCP 地址，例如 https://xxx.com/toy-next
        const BLE_SERVICE_UUID = 'AE30';     // 用户指定的服务 UUID
        const BLE_WRITE_UUID = 'AE01';       // 写入特征
        const BLE_NOTIFY_UUID = 'AE02';      // 通知特征
        // ========================================================

        let mcpPollingTimer = null;
        let bleDevice = null;
        let bleServer = null;
        let bleWriteCharacteristic = null;
        let isPolling = false;

        const logArea = document.getElementById('log-area');
        const mcpStatus = document.getElementById('mcp-status');
        const bleStatus = document.getElementById('ble-status');
        const audio = document.getElementById('keep-alive-audio');

        // 日志输出
        function log(msg, isError = false) {
            const time = new Date().toLocaleTimeString();
            const color = isError ? '#f44336' : '#0f0';
            logArea.innerHTML += `<div style="color:${color}">[${time}] ${msg}</div>`;
            logArea.scrollTop = logArea.scrollHeight;
        }

        // 初始化音频保活
        function startAudioKeepAlive() {
            audio.volume = 0.01; // 极小音量
            audio.play().then(() => {
                log('无声音频保活已启动');
            }).catch(e => {
                log('音频启动失败 (需要点击按钮): ' + e.message, true);
            });
        }

        // 蓝牙连接逻辑
        async function connectBluetooth() {
            try {
                log('正在请求蓝牙设备...');
                // 处理 16 位 UUID 字符串转 128 位标准
                const getFullUUID = (uuid) => uuid.length === 4 ? `0000${uuid}-0000-1000-8000-00805f9b34fb` : uuid;
                
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ services: [getFullUUID(BLE_SERVICE_UUID)] }],
                    optionalServices: [getFullUUID(BLE_SERVICE_UUID)]
                });

                bleDevice.addEventListener('gattserverdisconnected', onDisconnected);
                bleServer = await bleDevice.gatt.connect();
                const service = await bleServer.getPrimaryService(getFullUUID(BLE_SERVICE_UUID));
                
                bleWriteCharacteristic = await service.getCharacteristic(getFullUUID(BLE_WRITE_UUID));
                const notifyCharacteristic = await service.getCharacteristic(getFullUUID(BLE_NOTIFY_UUID));

                // 开启通知
                await notifyCharacteristic.startNotifications();
                notifyCharacteristic.addEventListener('characteristicvaluechanged', (event) => {
                    const value = new TextDecoder().decode(event.target.value);
                    log(`收到蓝牙通知: ${value}`);
                });

                bleStatus.innerText = '已连接';
                bleStatus.className = 'status-ok';
                log('蓝牙连接成功！');
                return true;
            } catch (error) {
                log('蓝牙连接失败: ' + error.message, true);
                bleStatus.innerText = '连接失败';
                bleStatus.className = 'status-err';
                return false;
            }
        }

        function onDisconnected() {
            bleStatus.innerText = '已断开';
            bleStatus.className = 'status-err';
            log('蓝牙连接已断开', true);
            bleWriteCharacteristic = null;
        }

        // 蓝牙发送数据
        async function writeBLE(data) {
            if (!bleWriteCharacteristic) {
                log('蓝牙未连接，无法发送', true);
                return;
            }
            try {
                const encoder = new TextEncoder();
                const payload = encoder.encode(JSON.stringify(data));
                await bleWriteCharacteristic.writeValue(payload);
                log(`蓝牙发送成功: ${JSON.stringify(data)}`);
            } catch (error) {
                log('蓝牙发送失败: ' + error.message, true);
            }
        }

        // MCP 轮询逻辑 (300ms)
        function startMCPPolling() {
            if (isPolling) return;
            isPolling = true;
            mcpStatus.innerText = '运行中';
            mcpStatus.className = 'status-ok';

            mcpPollingTimer = setInterval(async () => {
                try {
                    const response = await fetch(MCP_SERVER_URL, { method: 'GET', mode: 'cors' });
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    
                    const data = await response.json();
                    
                    // 静默跳过 null
                    if (data && data.command === null) return;

                    if (data && data.command && data.command.action) {
                        log(`📥 MCP指令: ${data.command.action} - ${data.command.value}`);
                        handleIncomingCommand(data.command.action, data.command.value);
                    }
                } catch (e) {
                    // 静默轮询出错时不报错，防止刷屏，但可以在内存中记录最后一次错误
                    // 为了调试，建议暂时打开下一行注释
                    // console.error('MCP轮询错误', e); 
                }
            }, 300);
            log('MCP 服务器轮询已启动 (300ms)');
        }

        // 处理 MCP 发来的指令
        function handleIncomingCommand(action, value) {
            // ⚠️ 这里就是对应你填的指令格式的地方！
            // 目前默认将指令转为 JSON 发给蓝牙
            // 如果 iRobot 有专门的十六进制格式，请在这里修改！
            
            // 例如：如果 action 是 "震动"，发送 JSON
            writeBLE({ action: action, value: value });
            
            // 如果要发送原始数据，比如 0x01 0x03，请改写成：
            // const hexData = new Uint8Array([0x01, 0x03]);
            // bleWriteCharacteristic.writeValue(hexData);
        }

        // UI 触发发送指令
        function sendCommand(action, value) {
            log(`⬆️ 手动发送: ${action} - ${value}`);
            handleIncomingCommand(action, value);
        }

        // 停止所有
        function stopAll() {
            if (mcpPollingTimer) {
                clearInterval(mcpPollingTimer);
                mcpPollingTimer = null;
            }
            isPolling = false;
            mcpStatus.innerText = '已停止';
            mcpStatus.className = 'status-err';
            
            if (bleWriteCharacteristic) {
                // 发送急停指令（假设）
                writeBLE({ action: 'stop', value: 0 });
            }
            
            log('🛑 已停止所有功能和轮询');
        }

        // 测试连接
        function testConnection() {
            log('▶️ 测试功能...');
            sendCommand('测试', 1);
        }

        // 启动按钮
        document.getElementById('btn-start').addEventListener('click', async () => {
            document.getElementById('btn-start').style.display = 'none';
            document.getElementById('control-panel').style.display = 'block';
            
            startAudioKeepAlive();
            const connected = await connectBluetooth();
            if (connected) {
                startMCPPolling();
            }
        });

    </script>
</body>
</html>
