<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>蓝牙 MCP 中继控制台</title>
    <style>
        /* ================= 基础与高级感波点背景 ================= */
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background-color: #fafbfc; 
            /* 更细腻的波点 */
            background-image: radial-gradient(#e2e8f0 1.2px, transparent 1.2px); 
            background-size: 20px 20px;
            color: #334155;
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
        }
        h1 { font-size: 22px; text-align: center; color: #1e293b; margin-top: 10px; margin-bottom: 25px; letter-spacing: 1px; font-weight: 800; }

        /* ================= 磨砂玻璃卡片 ================= */
        .card { 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px; 
            padding: 24px; 
            margin-bottom: 20px; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01); 
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        /* ================= 状态栏 ================= */
        .status-bar { display: flex; justify-content: space-between; font-size: 14px; color: #64748b; font-weight: 500; padding: 10px 5px; }
        .status-ok { color: #059669; font-weight: 700; text-shadow: 0 0 10px rgba(5, 150, 105, 0.2); }
        .status-err { color: #dc2626; font-weight: 700; }

        /* ================= 输入框与标签 ================= */
        .form-label { font-size: 13px; margin-bottom: 8px; color: #64748b; display: block; font-weight: 600; letter-spacing: 0.5px; }
        input[type="text"], input[type="password"] { 
            width: 100%; 
            padding: 16px; 
            border-radius: 14px; 
            border: 1px solid #e2e8f0; 
            background: rgba(248, 250, 252, 0.8); 
            color: #334155; 
            font-size: 15px;
            margin-bottom: 18px; 
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        input[type="text"]:focus, input[type="password"]:focus {
            border-color: #93c5fd;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(147, 197, 253, 0.15);
        }

        /* ================= 按钮风格 ================= */
        .btn-group { display: flex; gap: 12px; margin-top: 12px; }
        button { 
            flex: 1; 
            padding: 15px; 
            border: none; 
            border-radius: 14px; 
            font-size: 15px; 
            font-weight: 700; 
            cursor: pointer; 
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        button:active { transform: scale(0.96); filter: brightness(0.95); }
        
        /* 主按钮 - 清新渐变蓝 */
        .btn-start { 
            background: linear-gradient(135deg, #93c5fd 0%, #bfdbfe 100%); 
            color: #1e3a8a; 
            width: 100%; 
            padding: 18px; 
            font-size: 16px; 
            margin-top: 8px; 
            box-shadow: 0 8px 15px -3px rgba(147, 197, 253, 0.4); 
        }
        /* 功能按钮 - 不同柔和配色 */
        .btn-action { background: #e0f2fe; color: #0369a1; box-shadow: 0 4px 6px -1px rgba(224, 242, 254, 0.8); }
        .btn-action-alt { background: #fce7f3; color: #be185d; box-shadow: 0 4px 6px -1px rgba(252, 231, 243, 0.8); }
        .btn-test { background: #fef3c7; color: #b45309; box-shadow: 0 4px 6px -1px rgba(254, 243, 199, 0.8); }
        .btn-stop { background: #fee2e2; color: #b91c1c; box-shadow: 0 4px 6px -1px rgba(254, 226, 226, 0.8); }

        /* ================= 控制区域 ================= */
        .control-group { margin-bottom: 22px; padding-bottom: 18px; border-bottom: 1px dashed #e2e8f0; }
        .control-group:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .control-label { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 14px; color: #475569; font-weight: 600;}
        
        /* 滑块样式优化 */
        input[type="range"] { 
            width: 100%; 
            accent-color: #60a5fa; 
            margin-bottom: 15px; 
            height: 8px;
            border-radius: 4px;
            background: #e2e8f0;
        }

        /* ================= 日志区域 ================= */
        .log-box { 
            background: #ffffff; 
            border: 1px solid #e2e8f0; 
            border-radius: 14px; 
            padding: 15px; 
            height: 180px; 
            overflow-y: auto; 
            font-family: 'SF Mono', Menlo, Monaco, Consolas, monospace; 
            font-size: 12px; 
            color: #475569; 
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }
        .log-box div { margin-bottom: 6px; line-height: 1.5; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <h1>🤖 蓝牙 MCP 中继控制台</h1>

    <div class="card">
        <span class="form-label">🌐 MCP 服务器地址</span>
        <input type="text" id="mcp-url-input" value="https://ble-relay-template-production-d130.up.railway.app/toy-next">
        
        <span class="form-label">🔑 MCP 密码 (BRIDGE_SECRET)</span>
        <input type="password" id="mcp-secret-input" placeholder="请输入你在 Railway 设置的密码">
        
        <button id="btn-start" class="btn-start">启动系统（允许音频 & 连接蓝牙）</button>
    </div>

    <div class="card status-bar">
        <div>MCP 状态: <span id="mcp-status" class="status-err">未连接</span></div>
        <div>蓝牙状态: <span id="ble-status" class="status-err">未连接</span></div>
    </div>

    <div id="control-panel" class="card hidden">
        <div class="control-group">
            <div class="control-label"><span>震动强度</span><span id="val-vibrate">0</span></div>
            <input type="range" id="slider-vibrate" min="0" max="100" value="0" oninput="document.getElementById('val-vibrate').innerText=this.value">
            <div class="btn-group">
                <button class="btn-action" onclick="sendCommand('震动', document.getElementById('slider-vibrate').value)">发送震动指令</button>
            </div>
        </div>

        <div class="control-group">
            <div class="control-label"><span>伸缩程度</span><span id="val-telescope">0</span></div>
            <input type="range" id="slider-telescope" min="0" max="100" value="0" oninput="document.getElementById('val-telescope').innerText=this.value">
            <div class="btn-group">
                <button class="btn-action" onclick="sendCommand('伸缩', document.getElementById('slider-telescope').value)">发送伸缩指令</button>
            </div>
        </div>

        <div class="control-group">
            <div class="control-label"><span>转动速度</span><span id="val-rotate">0</span></div>
            <input type="range" id="slider-rotate" min="0" max="100" value="0" oninput="document.getElementById('val-rotate').innerText=this.value">
            <div class="btn-group">
                <button class="btn-action" onclick="sendCommand('转动', document.getElementById('slider-rotate').value)">发送转动指令</button>
            </div>
        </div>

        <div class="control-group">
            <div class="btn-group">
                <button class="btn-action-alt" onclick="sendCommand('加热', 'ON')">开启加热</button>
                <button class="btn-action" style="background:#f1f5f9; color:#475569; box-shadow:none;" onclick="sendCommand('加热', 'OFF')">关闭加热</button>
            </div>
        </div>

        <div class="btn-group" style="margin-top: 25px;">
            <button class="btn-test" onclick="testConnection()">测试所有功能</button>
            <button class="btn-stop" onclick="stopAll()">🛑 停止所有功能</button>
        </div>
    </div>

    <div class="card">
        <span class="form-label" style="margin-bottom: 12px;">📋 运行日志</span>
        <div id="log-area" class="log-box">等待启动...</div>
    </div>

    <audio id="keep-alive-audio" loop muted>
        <source src="https://img.baibai.cv/f/dZymTQ/30min-osbvow%202.mp4" type="audio/mpeg">
    </audio>

    <script>
        // ================= 全局变量 =================
        let currentMcpUrl = ''; 
        let currentMcpSecret = '';
        
        // ⚠️ 蓝牙配置
        const SERVICE_UUID = 'AE30';     
        const WRITE_UUID = 'AE01';       
        const NOTIFY_UUID = 'AE02';      
        const ADVERTISED_UUID = 'F0F0';  

        let mcpPollingTimer = null;
        let bleDevice = null;
        let bleServer = null;
        let bleWriteCharacteristic = null;
        let isPolling = false;
        let hasLogged401 = false; // MCP防刷屏开关

        const logArea = document.getElementById('log-area');
        const mcpStatus = document.getElementById('mcp-status');
        const bleStatus = document.getElementById('ble-status');
        const audio = document.getElementById('keep-alive-audio');

        // ================= 日志打印 =================
        function log(msg, isError = false) {
            const time = new Date().toLocaleTimeString();
            const color = isError ? '#dc2626' : '#059669';
            logArea.innerHTML += `<div style="color:${color}">[${time}] ${msg}</div>`;
            logArea.scrollTop = logArea.scrollHeight;
        }

        // ================= UUID 补全工具 =================
        function getFullUUID(uuid) {
            if (!uuid) return '';
            return uuid.length === 4 ? `0000${uuid}-0000-1000-8000-00805f9b34fb` : uuid;
        }

        // ================= 音频保活 =================
        function startAudioKeepAlive() {
            audio.volume = 0.01; 
            audio.play().then(() => log('无声音频保活已启动')).catch(e => log('音频启动失败: ' + e.message, true));
        }

        // ================= 连接蓝牙 =================
        async function connectBluetooth() {
            try {
                log('正在扫描蓝牙设备...');
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'SL' }], 
                    optionalServices: [getFullUUID(SERVICE_UUID), getFullUUID(ADVERTISED_UUID)]
                });

                bleDevice.addEventListener('gattserverdisconnected', onDisconnected);
                log('正在连接 GATT 服务器...');
                bleServer = await bleDevice.gatt.connect();
                const service = await bleServer.getPrimaryService(getFullUUID(SERVICE_UUID));
                
                bleWriteCharacteristic = await service.getCharacteristic(getFullUUID(WRITE_UUID));
                const notifyCharacteristic = await service.getCharacteristic(getFullUUID(NOTIFY_UUID));

                await notifyCharacteristic.startNotifications();
                notifyCharacteristic.addEventListener('characteristicvaluechanged', (event) => {
                    const value = new TextDecoder().decode(event.target.value);
                    log(`收到设备通知: ${value}`);
                });

                bleStatus.innerText = '已连接';
                bleStatus.className = 'status-ok';
                log('🎉 蓝牙连接成功！');
                return true;
            } catch (error) {
                log('蓝牙连接失败: ' + error.message, true);
                bleStatus.innerText = '连接失败';
                bleStatus.className = 'status-err';
                return false;
            }
        }

        function onDisconnected() {
            bleStatus.innerText = '已断开';
            bleStatus.className = 'status-err';
            log('蓝牙连接已断开', true);
            bleWriteCharacteristic = null;
        }

        // ================= 蓝牙发送数据 =================
        async function writeBLE(data) {
            if (!bleWriteCharacteristic) return;
            try {
                const encoder = new TextEncoder();
                await bleWriteCharacteristic.writeValue(encoder.encode(JSON.stringify(data)));
                log(`发送 JSON: ${JSON.stringify(data)}`);
            } catch (error) { log('发送失败: ' + error.message, true); }
        }

        // 🔥 直接发送十六进制字节
        async function writeHex(bytesArray) {
            if (!bleWriteCharacteristic) {
                log('蓝牙未连接，无法发送', true);
                return;
            }
            try {
                const payload = new Uint8Array(bytesArray);
                await bleWriteCharacteristic.writeValue(payload);
                log(`发送十六进制成功: [${bytesArray.map(b=>'0x'+b.toString(16)).join(', ')}]`);
            } catch (error) { log('发送十六进制失败: ' + error.message, true); }
        }

        // ================= 指令转换逻辑（核心，只保留这一个！） =================
        function handleIncomingCommand(action, value) {
            if (action === '测试') {
                log('尝试发送测试握手信号...');
                writeHex([0x73, 0x74, 0x61, 0x72, 0x74]); // 发送 "start" 的 ASCII 码
            } else if (action === '震动') {
                writeHex([0x05]); // 假设震动
            } else {
                writeBLE({ action: action, value: value });
            }
        }

        // ================= MCP 轮询 (300ms) =================
        function startMCPPolling() {
            if (isPolling) return;
            isPolling = true;
            mcpStatus.innerText = '运行中';
            mcpStatus.className = 'status-ok';
            log('MCP 轮询已启动 (300ms)');

            // 穷举式鉴权：把密码拼在URL后面（应对最粗糙的服务器）
            let urlWithSecret = currentMcpUrl;
            if (currentMcpSecret) {
                const sep = urlWithSecret.includes('?') ? '&' : '?';
                urlWithSecret += `${sep}secret=${encodeURIComponent(currentMcpSecret)}&key=${encodeURIComponent(currentMcpSecret)}&token=${encodeURIComponent(currentMcpSecret)}`;
            }

            mcpPollingTimer = setInterval(async () => {
                try {
                    const headers = {};
                    if (currentMcpSecret) {
                        headers['Authorization'] = currentMcpSecret; // 裸密码
                        headers['Authorization'] = `Bearer ${currentMcpSecret}`; // 带Bearer的
                        headers['X-Bridge-Secret'] = currentMcpSecret; 
                        headers['X-API-Key'] = currentMcpSecret;
                    }

                    const response = await fetch(urlWithSecret, { method: 'GET', mode: 'cors', headers: headers });
                    
                    if (response.status === 401) {
                        if (!hasLogged401) {
                            log('MCP 鉴权失败：尝试了多种方式均被拒，请检查Railway里的环境变量。已静默。', true);
                            hasLogged401 = true;
                            mcpStatus.innerText = '鉴权失败';
                            mcpStatus.className = 'status-err';
                        }
                        return;
                    }
                    
                    if (response.ok) {
                        mcpStatus.innerText = '运行中';
                        mcpStatus.className = 'status-ok';
                        hasLogged401 = false; 
                    }

                    const data = await response.json();
                    if (data && data.command === null) return;

                    if (data && data.command && data.command.action) {
                        log(`📥 收到 MCP 指令: ${data.command.action} - ${data.command.value}`);
                        handleIncomingCommand(data.command.action, data.command.value);
                    }
                } catch (e) {}
            }, 300);
        }

        function sendCommand(action, value) {
            log(`⬆️ 手动发送: ${action} - ${value}`);
            handleIncomingCommand(action, value);
        }

        function stopAll() {
            if (mcpPollingTimer) clearInterval(mcpPollingTimer);
            isPolling = false;
            mcpStatus.innerText = '已停止';
            mcpStatus.className = 'status-err';
            if (bleWriteCharacteristic) writeBLE({ action: 'stop', value: 0 });
            log('🛑 已停止所有功能和轮询');
        }

        function testConnection() {
            log('▶️ 测试功能...');
            sendCommand('测试', 1);
        }

        document.getElementById('btn-start').addEventListener('click', async () => {
            const urlInput = document.getElementById('mcp-url-input').value.trim();
            const secretInput = document.getElementById('mcp-secret-input').value.trim();
            
            currentMcpUrl = urlInput;
            currentMcpSecret = secretInput;
            
            document.getElementById('btn-start').style.display = 'none';
            document.getElementById('control-panel').classList.remove('hidden');
            
            startAudioKeepAlive();
            const connected = await connectBluetooth();
            if (connected) startMCPPolling();
        });
    </script>
</body>
</html>
